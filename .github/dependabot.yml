version: 2
updates:
  # Gradle dependencies: weekly security + version update PRs, and (paired with
  # the dependency graph submitted in ci.yml) CVE alerts on transitive deps.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
