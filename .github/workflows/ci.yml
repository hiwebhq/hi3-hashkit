name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege by default; the dependency-scan job raises what it needs.
permissions:
  contents: read

# Every action is pinned to a full commit SHA (mutable tags were hijacked in several 2026
# supply-chain incidents). Dependabot's github-actions ecosystem keeps the SHAs current.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail fast if gradle/wrapper/gradle-wrapper.jar is not an official Gradle release.
      - uses: gradle/actions/wrapper-validation@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # Google removed the legacy "tools" SDK package, which setup-android installs by
      # default and then fails on — request only platform-tools; AGP fetches the rest.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      # Fails only on NEW findings — existing ones are frozen in app/detekt-baseline.xml.
      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # Feeds GitHub's dependency graph with the full resolved dependency set so Dependabot
  # alerts cover transitive dependencies too. NOTE: alerts must be switched on in the repo's
  # Code-security settings for this to have any effect (docs/SECURITY.md).
  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
